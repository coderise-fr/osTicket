# Overlay for a small Droplet (1 vCPU, 1 GB RAM + swap): lower memory ceilings, a small
# database cache and few Apache workers. Loaded through COMPOSE_FILE in .env (see
# droplet/env.example); upsizing the Droplet = raise these values.
#
# Rough budget: web 400m + cron 128m + db 288m + Caddy/OS ~150m, backed by 2 GB of swap.

services:
  web:
    mem_limit: 400m
    cpus: 1.0
    environment:
      # Each prefork worker with mod_php is ~20-30 MB: 8 workers ~ 250 MB.
      OSTICKET_MAX_WORKERS: ${OSTICKET_MAX_WORKERS:-8}

  cron:
    mem_limit: 128m
    cpus: 0.5

  db:
    mem_limit: 288m
    cpus: 1.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --local-infile=0
      - --max-connections=30
      - --innodb-buffer-pool-size=96M
      - --innodb-log-file-size=32M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
