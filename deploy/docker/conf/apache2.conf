# osTicket production web server configuration (replaces the Debian default).
#
# Runs unprivileged (www-data, port 8080) behind a TLS reverse proxy.
# Only the modules listed below are loaded; everything else is absent.

ServerRoot "/etc/apache2"
ServerName localhost
DefaultRuntimeDir /run/apache2
PidFile /run/apache2/apache2.pid
Mutex file:/run/apache2 default
Listen 8080

ServerTokens Prod
ServerSignature Off
TraceEnable Off
HostnameLookups Off
UseCanonicalName Off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# --- modules (allowlist) ---------------------------------------------------
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module  /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module  /usr/lib/apache2/modules/mod_authz_host.so
LoadModule dir_module         /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module        /usr/lib/apache2/modules/mod_mime.so
LoadModule env_module         /usr/lib/apache2/modules/mod_env.so
LoadModule setenvif_module    /usr/lib/apache2/modules/mod_setenvif.so
LoadModule filter_module      /usr/lib/apache2/modules/mod_filter.so
LoadModule headers_module     /usr/lib/apache2/modules/mod_headers.so
LoadModule rewrite_module     /usr/lib/apache2/modules/mod_rewrite.so
LoadModule remoteip_module    /usr/lib/apache2/modules/mod_remoteip.so
LoadModule reqtimeout_module  /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule php_module         /usr/lib/apache2/modules/libphp.so

# --- processes (prefork is required by mod_php) ----------------------------
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         3
    MaxSpareServers         8
    ServerLimit            ${OSTICKET_MAX_WORKERS}
    MaxRequestWorkers      ${OSTICKET_MAX_WORKERS}
    MaxConnectionsPerChild 500
</IfModule>

# --- request limits ---------------------------------------------------------
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
LimitRequestBody 12582912
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 8190

# --- client address behind the reverse proxy -------------------------------
# Only the proxies listed in OSTICKET_TRUSTED_PROXIES may set X-Forwarded-For.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${OSTICKET_TRUSTED_PROXIES}
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# --- logs to the container output ------------------------------------------
LogLevel warn
ErrorLog /proc/self/fd/2
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# --- content -----------------------------------------------------------------
DocumentRoot "/var/www/html"
DirectoryIndex index.php
TypesConfig /etc/mime.types
AccessFileName .htaccess

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Deny by default, then open the document root only.
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html">
    Options None
    AllowOverride None
    # Both conditions must hold (RequireAll): osTicket only needs GET, POST and HEAD.
    <RequireAll>
        Require all granted
        Require method GET POST HEAD
    </RequireAll>
</Directory>

# The only folders that still read an .htaccess: front-controller rewrites shipped
# with osTicket (read-only, root-owned in this image, so they cannot be altered).
<Directory "/var/www/html/api">
    Options SymLinksIfOwnerMatch
    AllowOverride FileInfo
</Directory>
<Directory "/var/www/html/apps">
    Options SymLinksIfOwnerMatch
    AllowOverride FileInfo
</Directory>
<Directory "/var/www/html/scp/apps">
    Options SymLinksIfOwnerMatch
    AllowOverride FileInfo
</Directory>
<Directory "/var/www/html/pages">
    Options SymLinksIfOwnerMatch
    AllowOverride FileInfo
</Directory>

# Application code, configuration and data are never served directly.
<Directory "/var/www/html/include">
    Require all denied
</Directory>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "(?i)(\.inc\.php|\.(inc|bak|orig|sql|log|ya?ml|md|sh|phar|dist|swp))$">
    Require all denied
</FilesMatch>
# Include-only and command-line entry points: never meant to be requested over HTTP.
<FilesMatch "^(bootstrap|manage)\.php$">
    Require all denied
</FilesMatch>

# --- response headers --------------------------------------------------------
# osTicket already sends its own Content-Security-Policy (script-src 'self'
# 'unsafe-inline'; object-src 'none'); the one below only adds frame-ancestors, and
# browsers enforce both. A stricter policy would break the inline scripts osTicket
# relies on. HSTS is only sent when the proxy says the request was HTTPS.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Content-Security-Policy "frame-ancestors 'self'"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"
Header unset X-Powered-By
