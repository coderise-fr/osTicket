; osTicket production PHP settings, loaded after php.ini (production defaults).

expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.assertions = -1

date.timezone = UTC
sys_temp_dir = /tmp
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 2000

; Must stay consistent with Apache LimitRequestBody (12 MB) and with the
; attachment size configured in the osTicket admin panel.
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10

allow_url_include = Off
enable_dl = Off
; The application never needs a shell: these are the only process-spawning
; functions it references (shell_exec only on the optional system information page).
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source

; Files PHP may touch: the application, its configuration volume, temp files,
; PHP libraries, CA certificates for IMAP/SMTP over TLS, randomness.
open_basedir = /var/www/html:/etc/osticket:/tmp:/usr/local/lib/php:/usr/share/php:/usr/share/zoneinfo:/etc/ssl:/etc/ca-certificates:/usr/lib/ssl:/etc/mime.types:/dev/urandom:/dev/null:/proc/self/fd

; Sessions (osTicket stores sessions in the database; these flags apply to the cookie).
; OSTICKET_COOKIE_SECURE=0 is for plain-HTTP local testing only.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = ${OSTICKET_COOKIE_SECURE}

; The image is immutable, so PHP never has to check files for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.jit = off
realpath_cache_size = 4096K

apc.enabled = 1
apc.shm_size = 32M
apc.enable_cli = 0
