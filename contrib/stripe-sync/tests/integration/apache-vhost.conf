Listen 8001
ServerName localhost
<VirtualHost *:8001>
    DocumentRoot /srv/ost
    <Directory /srv/ost>
        AllowOverride All
        Require all granted
    </Directory>
    php_admin_value sendmail_path /usr/local/bin/fakesendmail
    php_admin_value error_log /tmp/php-err.log
    PassEnv STRIPE_SYNC_WEBHOOK_SECRET
</VirtualHost>